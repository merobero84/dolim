<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 여행지 다트 — 실시간 멀티</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0e14; --bg2: #16161f; --bg3: #1e1e2a;
  --border: rgba(255,255,255,0.08); --text: #e8e8f0; --muted: #8888a8;
  --accent: #e03c3c; --accent2: #f5a623; --green: #2ecc71; --radius: 12px;
}
body { font-family:'Nanum Gothic',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.screen { width:100%; max-width:960px; display:none; }
.screen.active { display:block; }
#screen-room.active { display:flex; flex-direction:column; gap:16px; }

/* ── 참여 화면 ── */
#screen-join { max-width:400px; margin:0 auto; }
.join-logo { font-family:'Black Han Sans',sans-serif; font-size:42px; text-align:center; margin-bottom:6px; }
.join-sub { text-align:center; color:var(--muted); font-size:14px; margin-bottom:36px; }
.join-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:28px 24px; }
.join-card label { display:block; font-size:12px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
.join-card input { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'Nanum Gothic',sans-serif; font-size:16px; padding:12px 14px; margin-bottom:16px; outline:none; transition:border-color 0.2s; }
.join-card input:focus { border-color:var(--accent); }
.join-card input::placeholder { color:var(--muted); }
.join-divider { display:flex; align-items:center; gap:12px; margin:20px 0; }
.join-divider span { color:var(--muted); font-size:12px; white-space:nowrap; }
.join-divider::before,.join-divider::after { content:''; flex:1; border-top:1px solid var(--border); }
.btn-primary { width:100%; padding:14px; background:var(--accent); color:white; border:none; border-radius:8px; font-family:'Black Han Sans',sans-serif; font-size:17px; letter-spacing:1px; cursor:pointer; transition:background 0.15s,transform 0.1s; box-shadow:0 4px 0 #971a1a; }
.btn-primary:hover { background:#e85555; }
.btn-primary:active { transform:translateY(2px); box-shadow:0 2px 0 #971a1a; }
.btn-primary:disabled { background:#444; box-shadow:none; cursor:not-allowed; }
.btn-secondary { width:100%; padding:12px; background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:8px; font-size:14px; cursor:pointer; transition:color 0.15s,border-color 0.15s; }
.btn-secondary:hover { color:var(--text); border-color:rgba(255,255,255,0.2); }
.err-msg { color:#ff6b6b; font-size:13px; margin-top:-10px; margin-bottom:12px; display:none; }

/* ── 헤더 ── */
.room-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 20px; }
.room-code-wrap { display:flex; align-items:center; gap:10px; }
.room-code-label { font-size:12px; color:var(--muted); }
.room-code { font-family:'Black Han Sans',sans-serif; font-size:22px; letter-spacing:4px; color:var(--accent2); }
.copy-btn { background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--muted); font-size:12px; padding:4px 10px; cursor:pointer; transition:color 0.15s; }
.copy-btn:hover { color:var(--text); }
.participants { display:flex; gap:8px; flex-wrap:wrap; }
.participant-chip { background:var(--bg3); border:1px solid var(--border); border-radius:20px; font-size:12px; padding:4px 12px; display:flex; align-items:center; gap:6px; }
.participant-chip .dot { width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0; }
.participant-chip.me { border-color:rgba(224,60,60,0.4); color:#ff9090; }

/* ── 게임 레이아웃 ── */
.game-main { display:grid; grid-template-columns:1fr 320px; gap:16px; align-items:start; }
@media(max-width:680px){ .game-main{ grid-template-columns:1fr; } }

/* ── 다트판 ── */
.board-area { display:flex; flex-direction:column; align-items:center; gap:18px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:24px 20px; }
.board-wrap { position:relative; width:300px; height:300px; }
.board-wrap canvas { border-radius:50%; display:block; box-shadow:0 0 0 4px rgba(255,255,255,0.06), 0 0 0 8px rgba(255,255,255,0.03); }
.pointer-triangle { position:absolute; top:-2px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:20px solid #fff; z-index:10; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
.center-dot { position:absolute; top:50%; left:50%; width:16px; height:16px; background:#fff; border:3px solid rgba(0,0,0,0.3); border-radius:50%; transform:translate(-50%,-50%); z-index:10; }
.throw-status { font-size:13px; color:var(--muted); min-height:20px; text-align:center; }
.throw-status.spinning { color:var(--accent2); }
.btn-throw { padding:14px 48px; background:var(--accent); color:white; border:none; border-radius:50px; font-family:'Black Han Sans',sans-serif; font-size:20px; letter-spacing:2px; cursor:pointer; transition:background 0.15s,transform 0.1s; box-shadow:0 5px 0 #971a1a; }
.btn-throw:hover { background:#e85555; }
.btn-throw:active { transform:translateY(3px); box-shadow:0 2px 0 #971a1a; }
.btn-throw:disabled { background:#333; color:#555; box-shadow:none; cursor:not-allowed; }
.result-box { background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:16px 20px; min-height:80px; text-align:center; width:100%; max-width:340px; transition:border-color 0.3s; }
.result-box.lit { border-color:var(--accent2); }
.result-placeholder { color:var(--muted); font-size:13px; line-height:1.7; }
.result-name { font-family:'Black Han Sans',sans-serif; font-size:28px; margin-bottom:4px; }
.result-desc { font-size:12px; color:var(--muted); line-height:1.7; margin-bottom:8px; }
.result-tags { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.result-tag { font-size:11px; padding:2px 8px; border-radius:12px; background:rgba(255,255,255,0.07); color:var(--muted); }
.result-thrower { font-size:12px; color:var(--accent2); margin-bottom:8px; }

/* ── 사이드 패널 ── */
.side-panel { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; min-height:360px; overflow:hidden; }
.side-tabs { display:flex; border-bottom:1px solid var(--border); }
.side-tab { flex:1; padding:13px; font-size:13px; text-align:center; cursor:pointer; color:var(--muted); background:transparent; border:none; transition:color 0.15s,background 0.15s; }
.side-tab.active { color:var(--text); background:var(--bg3); }
.side-content { display:none; flex-direction:column; gap:10px; padding:16px; flex:1; }
.side-content.active { display:flex; }
.feed-list { display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height:420px; }
.feed-list::-webkit-scrollbar { width:4px; }
.feed-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.feed-item { background:var(--bg3); border-radius:8px; padding:10px 12px; font-size:13px; border-left:3px solid transparent; animation:slideIn 0.3s ease; }
.feed-item.new { border-left-color:var(--accent2); }
@keyframes slideIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
.fi-who { color:var(--accent2); font-weight:700; margin-bottom:2px; }
.fi-dest { font-family:'Black Han Sans',sans-serif; font-size:16px; }
.fi-time { font-size:11px; color:var(--muted); margin-top:2px; }
.feed-empty { color:var(--muted); font-size:13px; text-align:center; margin-top:20px; line-height:1.7; }
.dest-list { display:flex; flex-direction:column; gap:6px; overflow-y:auto; max-height:300px; }
.dest-list::-webkit-scrollbar { width:4px; }
.dest-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.dest-item { display:flex; align-items:center; gap:10px; background:var(--bg3); border-radius:8px; padding:10px 12px; font-size:14px; }
.dest-item .dest-emoji { font-size:18px; flex-shrink:0; }
.dest-item .dest-name { flex:1; font-weight:700; }
.dest-item .dest-del { background:transparent; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:2px 6px; border-radius:4px; transition:color 0.15s,background 0.15s; flex-shrink:0; }
.dest-item .dest-del:hover { color:#ff6b6b; background:rgba(255,107,107,0.1); }
.dest-count { font-size:12px; color:var(--muted); }
.add-form { background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; }
.add-form label { font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.form-row { display:grid; grid-template-columns:64px 1fr; gap:8px; }
.add-form input,.add-form textarea { background:var(--bg2); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:'Nanum Gothic',sans-serif; font-size:13px; padding:8px 10px; outline:none; transition:border-color 0.2s; width:100%; }
.add-form input:focus,.add-form textarea:focus { border-color:var(--accent); }
.add-form input::placeholder,.add-form textarea::placeholder { color:var(--muted); }
.add-form textarea { resize:none; height:54px; }
.btn-add { padding:9px; background:var(--accent); color:white; border:none; border-radius:6px; font-family:'Black Han Sans',sans-serif; font-size:13px; cursor:pointer; transition:background 0.15s; }
.btn-add:hover { background:#e85555; }
.btn-reset { padding:8px; background:transparent; border:1px solid var(--border); border-radius:6px; color:var(--muted); font-size:12px; cursor:pointer; }
.btn-reset:hover { color:#ff6b6b; border-color:rgba(255,107,107,0.3); }
</style>
</head>
<body>

<div id="screen-join" class="screen active">
  <div class="join-logo">🎯</div>
  <p class="join-sub">다트 던져서 국내 여행지 뽑기<br>친구들이랑 같이!</p>
  <div class="join-card">
    <label>닉네임</label>
    <input id="input-nick" type="text" maxlength="12" placeholder="예: 메로" autocomplete="off">
    <label>방 코드로 참여</label>
    <input id="input-code" type="text" maxlength="4" placeholder="4자리 코드 (예: AB3K)" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;font-family:monospace;">
    <p class="err-msg" id="err-msg">방을 찾을 수 없어요. 코드를 다시 확인해봐!</p>
    <button class="btn-primary" onclick="joinRoom()">🚪 참여하기</button>
    <div class="join-divider"><span>또는</span></div>
    <button class="btn-secondary" onclick="createRoom()">✨ 새 방 만들기</button>
  </div>
</div>

<div id="screen-room" class="screen">
  <div class="room-header">
    <div class="room-code-wrap">
      <span class="room-code-label">방 코드</span>
      <span class="room-code" id="display-code">----</span>
      <button class="copy-btn" onclick="copyCode()">복사</button>
    </div>
    <div class="participants" id="participants-list"></div>
  </div>
  <div class="game-main">
    <div class="board-area">
      <div class="board-wrap">
        <div class="pointer-triangle"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
        <div class="center-dot"></div>
      </div>
      <p class="throw-status" id="status-msg">다트를 던져봐!</p>
      <button class="btn-throw" id="btn-throw" onclick="throwDart()">🎯 던져!</button>
      <div class="result-box" id="result-box">
        <p class="result-placeholder">아직 결과 없음.<br>다트를 던져보자!</p>
      </div>
    </div>
    <div class="side-panel">
      <div class="side-tabs">
        <button class="side-tab active" onclick="switchTab('feed')">📌 결과 피드</button>
        <button class="side-tab" onclick="switchTab('edit')">✏️ 여행지 편집</button>
      </div>
      <div class="side-content active" id="tab-feed">
        <div class="feed-list" id="feed-list">
          <p class="feed-empty">아직 아무도 안 던졌어!<br>첫 다트를 날려봐 🎯</p>
        </div>
      </div>
      <div class="side-content" id="tab-edit">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="dest-count" id="dest-count">0개</span>
          <button class="btn-reset" onclick="resetDefaults()">기본값으로</button>
        </div>
        <div class="dest-list" id="dest-list"></div>
        <div class="add-form">
          <label>여행지 추가</label>
          <div class="form-row">
            <input id="new-emoji" placeholder="🗺️" maxlength="4">
            <input id="new-name" placeholder="여행지 이름" maxlength="12">
          </div>
          <textarea id="new-desc" placeholder="짧은 설명 (선택)"></textarea>
          <input id="new-tags" placeholder="태그: 바다, 맛집 (쉼표 구분, 선택)">
          <button class="btn-add" onclick="addDestination()">+ 추가하기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ══════════════════════════════════════
   🔧 Firebase 설정 — 여기만 수정!
══════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyA3cVODaqtDxHPD0P2CDijTaNrvzTgIPc4",
  authDomain:        "girls-night-d1269.firebaseapp.com",
  databaseURL:       "https://girls-night-d1269-default-rtdb.firebaseio.com",
  projectId:         "girls-night-d1269",
  storageBucket:     "girls-night-d1269.firebasestorage.app",
  messagingSenderId: "3708739778",
  appId:             "1:3708739778:web:6f0f5ed9905ed2ef8b9b5b"
};

/* ══════════════════════════════════════
   🎨 돌림판 컬러 팔레트 — 뮤트 톤
   (원색 없이 채도 낮춘 세련된 조합)
══════════════════════════════════════ */
const PALETTE = [
  '#C17B7B', // 더스티 로즈
  '#C49A6C', // 웜 카라멜
  '#B8A86E', // 머스타드 베이지
  '#7EA87E', // 세이지 그린
  '#5FA8A0', // 뮤트 틸
  '#6A8FAF', // 스틸 블루
  '#8A7BAF', // 더스티 퍼플
  '#AF7BA0', // 모브
  '#AF7B7B', // 로즈 모브
  '#7BA88A', // 올리브 민트
  '#9A8070', // 웜 토프
  '#7B9AAF', // 슬레이트 블루
];

/* ══════════════════════════════════════
   기본 여행지 목록
══════════════════════════════════════ */
const DEFAULT_DESTINATIONS = [
  { name:'제주도', emoji:'🌊', desc:'에메랄드 바다, 한라산, 흑돼지! 사계절 언제나 좋아.', tags:['자연','해수욕','맛집'] },
  { name:'부산',   emoji:'🌆', desc:'해운대, 광안리, 감천마을! 도시와 바다의 조화.', tags:['해변','야경','해산물'] },
  { name:'경주',   emoji:'🏛️', desc:'천년 신라의 역사. 불국사, 첨성대, 황리단길.', tags:['역사','문화','야경'] },
  { name:'강릉',   emoji:'☕', desc:'정동진 일출, 경포대, 커피거리! 동해 감성.', tags:['바다','카페','일출'] },
  { name:'전주',   emoji:'🏮', desc:'한옥마을, 비빔밥, 막걸리골목! 전통 가득.', tags:['한옥','먹거리','전통'] },
  { name:'여수',   emoji:'🌅', desc:'낭만 항구! 밤바다 야경과 갓김치, 돌산대교.', tags:['야경','해산물','드라이브'] },
  { name:'통영',   emoji:'⛵', desc:'한국의 나폴리! 다도해 뷰와 굴, 꿀빵.', tags:['해양','역사','굴'] },
  { name:'속초',   emoji:'🏔️', desc:'설악산과 동해를 동시에! 닭강정 필수 코스.', tags:['산','바다','닭강정'] },
  { name:'안동',   emoji:'🥢', desc:'하회마을, 안동찜닭, 간고등어! 느린 여행.', tags:['문화재','찜닭','하회탈'] },
  { name:'춘천',   emoji:'🦆', desc:'닭갈비 성지, 남이섬, 의암호! 기차 여행 감성.', tags:['닭갈비','호수','남이섬'] },
  { name:'담양',   emoji:'🎋', desc:'메타세쿼이아길, 대나무 숲, 떡갈비!', tags:['자연','대나무','떡갈비'] },
  { name:'남해',   emoji:'🌿', desc:'독일마을, 다랭이논, 멸치쌈밥! 숨겨진 보석.', tags:['드라이브','힐링','멸치'] },
];

/* ══════════════════════════════════════
   앱 상태
══════════════════════════════════════ */
let db, roomRef, participantsRef, throwRef, historyRef, destRef;
let destinations = [...DEFAULT_DESTINATIONS];
let currentAngle = 0, spinning = false;
let myNickname = '', myRoomId = '', lastThrowId = null;
const USER_ID = 'u_' + Math.random().toString(36).slice(2, 10);

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
} catch(e) {
  alert('Firebase 설정이 필요해요! FIREBASE_CONFIG를 채워주세요.');
}

/* ══════════════════════════════════════
   방 참여 / 생성
══════════════════════════════════════ */
function generateCode() {
  return Array.from({length:4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
}
async function createRoom() {
  const nick = document.getElementById('input-nick').value.trim();
  if (!nick) { alert('닉네임을 입력해줘!'); return; }
  await enterRoom(generateCode(), nick, true);
}
async function joinRoom() {
  const nick = document.getElementById('input-nick').value.trim();
  const code = document.getElementById('input-code').value.trim().toUpperCase();
  if (!nick) { alert('닉네임을 입력해줘!'); return; }
  if (code.length !== 4) { alert('방 코드는 4자리야!'); return; }
  const snap = await db.ref(`rooms/${code}`).once('value');
  const err = document.getElementById('err-msg');
  if (!snap.exists()) { err.style.display='block'; return; }
  err.style.display='none';
  await enterRoom(code, nick, false);
}
async function enterRoom(code, nick, isNew) {
  myRoomId = code; myNickname = nick;
  participantsRef = db.ref(`rooms/${code}/participants`);
  throwRef        = db.ref(`rooms/${code}/lastThrow`);
  historyRef      = db.ref(`rooms/${code}/history`);
  destRef         = db.ref(`rooms/${code}/destinations`);
  const myRef = participantsRef.child(USER_ID);
  await myRef.set({ nickname: nick, joinedAt: Date.now() });
  myRef.onDisconnect().remove();
  if (isNew) await destRef.set(DEFAULT_DESTINATIONS.map(d => ({ ...d, tags: d.tags.join(',') })));
  participantsRef.on('value', onParticipantsUpdate);
  throwRef.on('value', onThrowUpdate);
  historyRef.limitToLast(30).on('value', onHistoryUpdate);
  destRef.on('value', onDestinationsUpdate);
  document.getElementById('display-code').textContent = code;
  document.getElementById('screen-join').classList.remove('active');
  document.getElementById('screen-room').classList.add('active');
}

/* ══════════════════════════════════════
   Firebase 리스너
══════════════════════════════════════ */
function onParticipantsUpdate(snap) {
  const data = snap.val() || {};
  const list = document.getElementById('participants-list');
  list.innerHTML = '';
  Object.entries(data).forEach(([uid, p]) => {
    const chip = document.createElement('div');
    chip.className = 'participant-chip' + (uid === USER_ID ? ' me' : '');
    chip.innerHTML = `<span class="dot"></span>${p.nickname}${uid === USER_ID ? ' (나)' : ''}`;
    list.appendChild(chip);
  });
}
function onThrowUpdate(snap) {
  const data = snap.val();
  if (!data || data.throwId === lastThrowId) return;
  lastThrowId = data.throwId;
  animateTo(data.idx, data.thrower);
}
function onHistoryUpdate(snap) {
  const data = snap.val();
  const list = document.getElementById('feed-list');
  if (!data) { list.innerHTML='<p class="feed-empty">아직 아무도 안 던졌어!<br>첫 다트를 날려봐 🎯</p>'; return; }
  list.innerHTML = '';
  Object.values(data).reverse().forEach((item, i) => {
    const dest = destinations[item.idx] || { emoji:'❓', name:'알 수 없음' };
    const el = document.createElement('div');
    el.className = 'feed-item' + (i===0 ? ' new' : '');
    el.innerHTML = `<div class="fi-who">${item.thrower}</div>
      <div class="fi-dest">${dest.emoji} ${item.destName || dest.name}</div>
      <div class="fi-time">${new Date(item.timestamp).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div>`;
    list.appendChild(el);
  });
}
function onDestinationsUpdate(snap) {
  const data = snap.val();
  if (!data) return;
  destinations = (Array.isArray(data) ? data : Object.values(data)).map(d => ({
    ...d, tags: typeof d.tags === 'string' ? d.tags.split(',').map(t=>t.trim()).filter(Boolean) : (d.tags||[])
  }));
  drawWheel(currentAngle);
  renderDestList();
}

/* ══════════════════════════════════════
   여행지 편집
══════════════════════════════════════ */
function renderDestList() {
  const list = document.getElementById('dest-list');
  document.getElementById('dest-count').textContent = `${destinations.length}개`;
  list.innerHTML = '';
  destinations.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'dest-item';
    el.innerHTML = `<span class="dest-emoji">${d.emoji||'📍'}</span>
      <span class="dest-name">${d.name}</span>
      <button class="dest-del" onclick="removeDestination(${i})">✕</button>`;
    list.appendChild(el);
  });
}
function addDestination() {
  const emoji = document.getElementById('new-emoji').value.trim() || '📍';
  const name  = document.getElementById('new-name').value.trim();
  const desc  = document.getElementById('new-desc').value.trim();
  const tags  = document.getElementById('new-tags').value.trim();
  if (!name) { alert('여행지 이름을 입력해줘!'); return; }
  const updated = [...destinations.map(d=>({...d, tags:(d.tags||[]).join(',')})),
    { name, emoji, desc, tags: tags.split(',').map(t=>t.trim()).filter(Boolean).join(',') }];
  destRef.set(updated).then(() => {
    ['new-emoji','new-name','new-desc','new-tags'].forEach(id => document.getElementById(id).value='');
  });
}
function removeDestination(idx) {
  if (destinations.length <= 2) { alert('최소 2개는 있어야 해!'); return; }
  if (!confirm(`"${destinations[idx].name}" 삭제할까?`)) return;
  destRef.set(destinations.filter((_,i)=>i!==idx).map(d=>({...d,tags:(d.tags||[]).join(',')})));
}
function resetDefaults() {
  if (!confirm('기본 여행지 12개로 초기화할까?')) return;
  destRef.set(DEFAULT_DESTINATIONS.map(d=>({...d,tags:d.tags.join(',')})));
}

/* ══════════════════════════════════════
   다트 던지기
══════════════════════════════════════ */
function throwDart() {
  if (spinning || !destinations.length) return;
  const idx = Math.floor(Math.random() * destinations.length);
  const throwId = Date.now() + '_' + USER_ID;
  const histKey = historyRef.push().key;
  db.ref(`rooms/${myRoomId}`).update({
    lastThrow: { idx, thrower: myNickname, throwId, timestamp: Date.now() },
    [`history/${histKey}`]: { idx, destName: destinations[idx].name, thrower: myNickname, timestamp: Date.now() }
  });
}

/* ══════════════════════════════════════
   애니메이션
══════════════════════════════════════ */
function animateTo(targetIdx, throwerName) {
  if (spinning) return;
  spinning = true;
  document.getElementById('btn-throw').disabled = true;
  const status = document.getElementById('status-msg');
  status.textContent = `${throwerName}이(가) 던지는 중... 🎯`;
  status.className = 'throw-status spinning';
  const N = destinations.length;
  const ARC = (2 * Math.PI) / N;
  let targetAngle = -Math.PI / 2 - (targetIdx + 0.5) * ARC;
  const minSpin = 5 * 2 * Math.PI;
  let delta = ((targetAngle - currentAngle) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  if (delta === 0) delta = 2 * Math.PI;
  targetAngle = currentAngle + delta;
  while (targetAngle - currentAngle < minSpin) targetAngle += 2 * Math.PI;
  const duration = 3800, startAngle = currentAngle, startTime = performance.now();
  const easeOut = t => 1 - Math.pow(1-t, 4);
  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    currentAngle = startAngle + (targetAngle - startAngle) * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) { requestAnimationFrame(frame); return; }
    currentAngle = currentAngle % (2 * Math.PI);
    spinning = false;
    document.getElementById('btn-throw').disabled = false;
    status.textContent = '다트를 던져봐!';
    status.className = 'throw-status';
    showResult(targetIdx, throwerName);
  }
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════
   🎨 바퀴 그리기 — 뮤트 톤 + 가독성 개선
══════════════════════════════════════ */
function drawWheel(angle) {
  const canvas = document.getElementById('wheel');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, cx = W/2, cy = W/2, r = W/2 - 3;
  const N = destinations.length;
  if (N === 0) { ctx.clearRect(0,0,W,W); return; }
  const ARC = (2 * Math.PI) / N;
  ctx.clearRect(0, 0, W, W);

  destinations.forEach((dest, i) => {
    const start = angle + i * ARC, end = start + ARC;

    // 섹션 채우기
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();

    // 경계선 — 흰색 얇게
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 텍스트 영역: 바깥쪽 호 따라 배치
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + ARC / 2);

    // 텍스트 배경 바 (반투명 어두운 띠 → 가독성 확보)
    const textX = r - 14;
    const barW = r * 0.52;
    const barH = 20;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.roundRect(textX - barW, -barH/2, barW, barH, 4);
    ctx.fill();

    // 이름 텍스트
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px "Nanum Gothic", sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;
    ctx.fillText(dest.name, textX, 5);

    ctx.restore();
  });

  // 중앙 원 (덮어씌우기)
  ctx.beginPath();
  ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
  ctx.fillStyle = '#1e1e2a';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function showResult(idx, thrower) {
  const dest = destinations[idx];
  if (!dest) return;
  const box = document.getElementById('result-box');
  box.className = 'result-box lit';
  box.innerHTML = `
    <div class="result-thrower">${thrower}의 결과</div>
    <div class="result-name">${dest.emoji||'📍'} ${dest.name}</div>
    ${dest.desc ? `<div class="result-desc">${dest.desc}</div>` : ''}
    ${dest.tags&&dest.tags.length ? `<div class="result-tags">${dest.tags.map(t=>`<span class="result-tag">${t}</span>`).join('')}</div>` : ''}
  `;
}

/* ── 탭 / 유틸 ── */
function switchTab(tab) {
  document.querySelectorAll('.side-tab').forEach((el,i) => el.classList.toggle('active', (tab==='feed'&&i===0)||(tab==='edit'&&i===1)));
  document.getElementById('tab-feed').classList.toggle('active', tab==='feed');
  document.getElementById('tab-edit').classList.toggle('active', tab==='edit');
}
function copyCode() {
  navigator.clipboard.writeText(myRoomId).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '복사됨!';
    setTimeout(()=>btn.textContent='복사', 1500);
  });
}
document.getElementById('input-code').addEventListener('input', function(){ this.value = this.value.toUpperCase(); });
window.addEventListener('load', () => drawWheel(0));
</script>
