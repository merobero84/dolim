<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

body{font-family:'Nanum Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.screen{width:100%;max-width:980px;display:none;}
.screen.active{display:block;}
#screen-room.active{display:flex;flex-direction:column;gap:14px;}

/* 참여 화면 */
#screen-join{max-width:400px;margin:0 auto;}
.join-logo{font-family:'Black Han Sans',sans-serif;font-size:40px;text-align:center;margin-bottom:6px;}
.join-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:32px;}
.join-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;}
.join-card label{display:block;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.join-card input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Nanum Gothic',sans-serif;font-size:16px;padding:12px 14px;margin-bottom:14px;outline:none;transition:border-color 0.2s;}
.join-card input:focus{border-color:var(--accent);}
.join-card input::placeholder{color:var(--muted);}
.join-divider{display:flex;align-items:center;gap:12px;margin:18px 0;}
.join-divider span{color:var(--muted);font-size:12px;white-space:nowrap;}
.join-divider::before,.join-divider::after{content:'';flex:1;border-top:1px solid var(--border);}
.btn-primary{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:8px;font-family:'Black Han Sans',sans-serif;font-size:16px;letter-spacing:1px;cursor:pointer;transition:background 0.15s,transform 0.1s;box-shadow:0 4px 0 #8b1a1a;}
.btn-primary:hover{background:#e85555;}
.btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 #8b1a1a;}
.btn-primary:disabled{background:#333;box-shadow:none;cursor:not-allowed;}
.btn-secondary{width:100%;padding:12px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;font-size:14px;cursor:pointer;transition:color 0.15s;}
.btn-secondary:hover{color:var(--text);}
.err-msg{color:#ff6b6b;font-size:12px;margin-top:-8px;margin-bottom:12px;display:none;}

/* 헤더 */
.room-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;}
.room-code-wrap{display:flex;align-items:center;gap:10px;}
.room-code-label{font-size:11px;color:var(--muted);}
.room-code{font-family:'Black Han Sans',sans-serif;font-size:20px;letter-spacing:4px;color:var(--accent2);}
.copy-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:11px;padding:4px 10px;cursor:pointer;}
.copy-btn:hover{color:var(--text);}
.participants{display:flex;gap:8px;flex-wrap:wrap;}
.p-chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:12px;padding:4px 12px;display:flex;align-items:center;gap:5px;}
.p-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
.p-chip.me{border-color:rgba(224,60,60,0.4);color:#ff9090;}

/* 게임 레이아웃 */
.game-main{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start;}
@media(max-width:700px){.game-main{grid-template-columns:1fr;}}

/* 지도 영역 */
.map-area{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.map-wrap{position:relative;}
#map-canvas{display:block;border-radius:8px;}

.throw-status{font-size:13px;color:var(--muted);text-align:center;min-height:18px;}
.throw-status.spinning{color:var(--accent2);}
.btn-throw{padding:13px 44px;background:var(--accent);color:white;border:none;border-radius:50px;font-family:'Black Han Sans',sans-serif;font-size:19px;letter-spacing:2px;cursor:pointer;transition:background 0.15s,transform 0.1s;box-shadow:0 5px 0 #8b1a1a;}
.btn-throw:hover{background:#e85555;}
.btn-throw:active{transform:translateY(3px);box-shadow:0 2px 0 #8b1a1a;}
.btn-throw:disabled{background:#2a2a2a;color:#444;box-shadow:none;cursor:not-allowed;}

.result-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-height:76px;text-align:center;width:100%;max-width:380px;transition:border-color 0.3s;}
.result-box.lit{border-color:var(--accent2);}
.result-placeholder{color:var(--muted);font-size:13px;line-height:1.7;}
.result-name{font-family:'Black Han Sans',sans-serif;font-size:26px;margin-bottom:4px;}
.result-desc{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:8px;}
.result-tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.result-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,0.06);color:var(--muted);}
.result-thrower{font-size:12px;color:var(--accent2);margin-bottom:6px;}

.side-content{display:none;flex-direction:column;gap:10px;padding:14px;flex:1;}

.feed-list{display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:450px;}
.feed-list::-webkit-scrollbar{width:3px;}
.feed-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.feed-item{background:var(--bg3);border-radius:7px;padding:9px 11px;font-size:12px;border-left:3px solid transparent;animation:slideIn 0.3s ease;}

/* ══════════════════════════════════════
   Point-in-polygon (ray casting)
══════════════════════════════════════ */
function pointInPoly(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function lightenColor(hex, amt=40) {
  const {r,g,b} = hexToRgb(hex);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}

function drawMap() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // 바다 배경
  ctx.fillStyle = '#0d1f3c';
  ctx.fillRect(0, 0, W, H);

  // 바다 텍스처 (dots)
  ctx.fillStyle = 'rgba(255,255,255,0.015)';
  for (let x = 10; x < W; x += 20) {
    for (let y = 10; y < H; y += 20) {
      ctx.beginPath();
      ctx.arc(x, y, 1, 0, 2*Math.PI);
      ctx.fill();
    }
  }

  // 지역 그리기
  PROVINCES.forEach((p, i) => {
    const isHighlighted = i === currentProvinceIdx;
    const isDisabled = !enabled[i];

    ctx.beginPath();
    ctx.moveTo(p.poly[0][0], p.poly[0][1]);
    p.poly.slice(1).forEach(pt => ctx.lineTo(pt[0], pt[1]));
    ctx.closePath();

    if (isDisabled) {
      ctx.fillStyle = 'rgba(40,45,60,0.7)';
    } else if (isHighlighted) {
      ctx.fillStyle = lightenColor(p.color, 55);
    } else {
      ctx.fillStyle = p.color;
    }
    ctx.fill();

    // 경계선
    ctx.strokeStyle = isHighlighted ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = isHighlighted ? 2 : 0.8;
    ctx.stroke();

    // 하이라이트 글로우
    if (isHighlighted) {
      ctx.shadowColor = lightenColor(p.color, 80);
      ctx.shadowBlur = 12;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    if (!isDisabled) {
      // 지역명 레이블
      const [cx, cy] = p.center;
      ctx.save();
      ctx.font = `bold ${i < 8 ? 10 : 11}px "Nanum Gothic"`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 텍스트 배경
      const label = p.emoji + ' ' + p.name;
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.roundRect(cx - tw/2 - 4, cy - 8, tw + 8, 16, 4);
      ctx.fill();

      ctx.fillStyle = isHighlighted ? '#ffffff' : 'rgba(255,255,255,0.88)';
      ctx.fillText(label, cx, cy);
      ctx.restore();
    }
  });

  // 다트 그리기
  if (dartPos) {
    drawDart(dartPos.x, dartPos.y);
  }
}

function drawDart(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // 꼬리 날개
  ctx.beginPath();
  ctx.moveTo(0, -32);
  ctx.lineTo(-7, -44);
  ctx.lineTo(0, -40);
  ctx.lineTo(7, -44);
  ctx.closePath();
  ctx.fillStyle = '#e03c3c';
  ctx.fill();

  // 다트 몸통
  const grad = ctx.createLinearGradient(-3, -32, 3, -32);
  grad.addColorStop(0, '#888');
  grad.addColorStop(1, '#ccc');
  ctx.fillStyle = grad;
  ctx.fillRect(-2.5, -30, 5, 26);

  // 다트 팁
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.lineTo(-3.5, -4);
  ctx.lineTo(3.5, -4);
  ctx.closePath();
  ctx.fillStyle = '#e8e8e0';
  ctx.fill();

  // 꽂힌 효과 (흔들림 줄기)
  if (dartPos && dartPos.landed) {
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2,3]);
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.lineTo(0, 18);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

/* ══════════════════════════════════════
   방 참여 / 생성
══════════════════════════════════════ */
function generateCode() {
  return Array.from({length:4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
}

async function createRoom() {
  const nick = document.getElementById('input-nick').value.trim();
  if (!nick) { alert('닉네임을 입력해줘!'); return; }
  await enterRoom(generateCode(), nick);
}

async function joinRoom() {
  const nick = document.getElementById('input-nick').value.trim();
  const code = document.getElementById('input-code').value.trim().toUpperCase();
  if (!nick) { alert('닉네임을 입력해줘!'); return; }
  if (code.length !== 4) { alert('방 코드는 4자리야!'); return; }
  const snap = await db.ref(`rooms/${code}`).once('value');
  const err = document.getElementById('err-msg');
  if (!snap.exists()) { err.style.display='block'; return; }
  err.style.display = 'none';
  await enterRoom(code, nick);
}

async function enterRoom(code, nick) {
  myRoomId = code; myNickname = nick;
  participantsRef = db.ref(`rooms/${code}/participants`);
  throwRef        = db.ref(`rooms/${code}/lastThrow`);
  historyRef      = db.ref(`rooms/${code}/history`);
  enabledRef      = db.ref(`rooms/${code}/enabled`);

  const myRef = participantsRef.child(USER_ID);
  await myRef.set({ nickname: nick, joinedAt: Date.now() });
  myRef.onDisconnect().remove();

  participantsRef.on('value', onParticipantsUpdate);
  throwRef.on('value', onThrowUpdate);
  historyRef.limitToLast(30).on('value', onHistoryUpdate);
  enabledRef.on('value', snap => {
    const data = snap.val();
    if (data) enabled = data;
    renderToggleList();
    drawMap();
  });

  document.getElementById('display-code').textContent = code;
  document.getElementById('screen-join').classList.remove('active');
  document.getElementById('screen-room').classList.add('active');

  renderToggleList();
  drawMap();
}

/* ══════════════════════════════════════
   Firebase 리스너
══════════════════════════════════════ */
function onParticipantsUpdate(snap) {
  const data = snap.val() || {};
  const list = document.getElementById('participants-list');
  list.innerHTML = '';
  Object.entries(data).forEach(([uid, p]) => {
    const chip = document.createElement('div');
    chip.className = 'p-chip' + (uid === USER_ID ? ' me' : '');
    chip.innerHTML = `<span class="dot"></span>${p.nickname}${uid===USER_ID?' (나)':''}`;
    list.appendChild(chip);
  });
}

function onThrowUpdate(snap) {
  const data = snap.val();
  if (!data || data.throwId === lastThrowId) return;
  lastThrowId = data.throwId;
  animateDart(data.provinceIdx, data.thrower);
}

function onHistoryUpdate(snap) {
  const data = snap.val();
  const list = document.getElementById('feed-list');
  if (!data) { list.innerHTML='<p class="feed-empty">아직 아무도 안 던졌어!<br>첫 다트를 날려봐 🎯</p>'; return; }
  list.innerHTML = '';
  Object.values(data).reverse().forEach((item, i) => {
    const p = PROVINCES[item.provinceIdx];
    const el = document.createElement('div');
    el.className = 'feed-item' + (i===0?' new':'');
    el.innerHTML = `<div class="fi-who">${item.thrower}</div>
      <div class="fi-dest">${p ? p.emoji+' '+p.name : '?'}</div>
      <div class="fi-time">${new Date(item.timestamp).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div>`;
    list.appendChild(el);
  });
}

/* ══════════════════════════════════════
   다트 던지기
══════════════════════════════════════ */
function throwDart() {
  if (animating) return;
  const enabledIdxs = enabled.map((v,i)=>v?i:-1).filter(i=>i>=0);
  if (enabledIdxs.length === 0) { alert('지역을 최소 1개는 켜놔야 해!'); return; }

  const provinceIdx = enabledIdxs[Math.floor(Math.random() * enabledIdxs.length)];
  const throwId = Date.now() + '_' + USER_ID;
  const histKey = historyRef.push().key;

  db.ref(`rooms/${myRoomId}`).update({
    lastThrow: { provinceIdx, thrower: myNickname, throwId, timestamp: Date.now() },
    [`history/${histKey}`]: { provinceIdx, thrower: myNickname, timestamp: Date.now() }
  });
}

/* ══════════════════════════════════════
   다트 애니메이션
══════════════════════════════════════ */
function animateDart(provinceIdx, throwerName) {
  if (animating) return;
  animating = true;

  const btn = document.getElementById('btn-throw');
  const status = document.getElementById('status-msg');
  btn.disabled = true;
  status.textContent = `${throwerName}이(가) 다트를 날리는 중... 🎯`;
  status.className = 'throw-status spinning';

  const p = PROVINCES[provinceIdx];
  const targetX = p.center[0] + (Math.random() - 0.5) * 12;
  const targetY = p.center[1] + (Math.random() - 0.5) * 10;
  const startY = -50;

  currentProvinceIdx = -1;
  dartPos = { x: targetX, y: startY, landed: false };

  const duration = 900;
  const startTime = performance.now();

  function easeIn(t) { return t * t * t; }

  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const eased = easeIn(t);
    dartPos = { x: targetX, y: startY + (targetY - startY) * eased, landed: false };
    drawMap();

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      // 꽂힘!
      dartPos = { x: targetX, y: targetY, landed: true };
      currentProvinceIdx = provinceIdx;
      drawMap();
      
      // 흔들림 효과
      let shakes = 0;
      const shakeInterval = setInterval(() => {
        dartPos.x = targetX + (Math.random() - 0.5) * 3;
        drawMap();
        shakes++;
        if (shakes > 5) {
          clearInterval(shakeInterval);
          dartPos = { x: targetX, y: targetY, landed: true };
          drawMap();
          animating = false;
          btn.disabled = false;
          status.textContent = '🎯 다트를 던져봐!';
          status.className = 'throw-status';
          showResult(provinceIdx, throwerName);
        }
      }, 60);
    }
  }

  requestAnimationFrame(frame);
}

function showResult(idx, thrower) {
  const p = PROVINCES[idx];
  const box = document.getElementById('result-box');
  box.className = 'result-box lit';
  box.innerHTML = `
    <div class="result-thrower">${thrower}의 결과</div>
    <div class="result-name">${p.emoji} ${p.name}</div>
    <div class="result-desc">${p.desc}</div>
    <div class="result-tags">${p.tags.map(t=>`<span class="result-tag">${t}</span>`).join('')}</div>
  `;
}

/* ══════════════════════════════════════
   지역 토글
══════════════════════════════════════ */
function renderToggleList() {
  const list = document.getElementById('toggle-list');
  list.innerHTML = '';
  PROVINCES.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'toggle-item' + (enabled[i] ? '' : ' off');
    el.innerHTML = `<span class="t-color" style="background:${p.color}"></span>
      <span class="t-name">${p.emoji} ${p.name}</span>
      <span class="t-check">${enabled[i] ? '✓' : '○'}</span>`;
    el.onclick = () => {
      const newEnabled = [...enabled];
      newEnabled[i] = !newEnabled[i];
      enabledRef.set(newEnabled);
    };
    list.appendChild(el);
  });
}

/* ── 유틸 ── */
function switchTab(tab) {
  document.querySelectorAll('.side-tab').forEach((el,i)=>el.classList.toggle('active',(tab==='feed'&&i===0)||(tab==='toggle'&&i===1)));
  document.getElementById('tab-feed').classList.toggle('active', tab==='feed');
  document.getElementById('tab-toggle').classList.toggle('active', tab==='toggle');
}
function copyCode() {
  navigator.clipboard.writeText(myRoomId).then(()=>{
    const btn=document.querySelector('.copy-btn');
    btn.textContent='복사됨!';
    setTimeout(()=>btn.textContent='복사',1500);
  });
}
document.getElementById('input-code').addEventListener('input',function(){this.value=this.value.toUpperCase();});
window.addEventListener('load', () => drawMap());
</script>
